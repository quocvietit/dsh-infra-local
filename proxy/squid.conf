http_port 3128

visible_hostname dsh-egress-proxy
pid_filename /run/squid.pid
coredump_dir /var/spool/squid

# ICMP pinger is unreliable in Docker and is not required for CONNECT tunnels.
pinger_enable off

# Resolve via Docker embedded DNS (127.0.0.11). That stays on the Docker
# network; the engine forwards to the host's DNS (company DNS if the PC uses it).
# Do not point Squid at 1.1.1.1/8.8.8.8. IPv6 is disabled in compose (503 hangs).
dns_timeout 5 seconds
dns_nameservers 127.0.0.11

connect_timeout 30 seconds
forward_timeout 30 seconds
read_timeout 15 minutes

# CONNECT tunnels are not cacheable; keep a small memory cache only.
cache deny all
cache_mem 32 MB

# -------------------------------------
# Allowed ports
# -------------------------------------

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443

acl CONNECT method CONNECT

# -------------------------------------
# Domain whitelist
# -------------------------------------

acl allowed_domains dstdomain "/etc/squid/allow-domains.txt"

# -------------------------------------
# Security
# -------------------------------------

http_access deny !Safe_ports

http_access deny CONNECT !SSL_ports

# ONLY domains configured above
http_access allow allowed_domains

# Everything else blocked
http_access deny all

# -------------------------------------
# Privacy
# -------------------------------------

forwarded_for delete
via off
request_header_access X-Forwarded-For deny all
request_header_access Via deny all

# -------------------------------------
# Logging
# -------------------------------------

access_log daemon:/var/log/squid/access.log squid
