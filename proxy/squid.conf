http_port 3128

visible_hostname dsh-egress-proxy
pid_filename /run/squid.pid
coredump_dir /var/spool/squid

# ICMP pinger is unreliable in Docker and is not required for CONNECT tunnels.
pinger_enable off

# -------------------------------------
# DNS
# -------------------------------------
# Resolve via Docker embedded DNS (127.0.0.11), which forwards to the host's
# configured DNS (company DNS if the PC uses it). Do NOT point Squid at
# 1.1.1.1/8.8.8.8 — IPv6 is disabled in compose to avoid 503 hangs.
#
# How dst ACL interacts with DNS:
#   - dstdomain ACL  → hostname matched directly from the request; no DNS needed.
#   - dst ACL (IPs)  → Squid resolves the hostname to an IP, then checks the ACL.
#                      A DNS failure means the ACL misses; the request falls
#                      through to the port-deny rules and is likely blocked.
#                      Using a bare IP in CONNECT (CONNECT 10.x.x.x:port) avoids
#                      this — no lookup required.
#     If you call an internal service by hostname and it is not resolvable via
#     the host's DNS, add its domain to allow-domains.txt (dstdomain match)
#     instead of relying on allow-internal.txt (dst match).
dns_timeout 5 seconds
dns_nameservers 127.0.0.11

connect_timeout 15 seconds
forward_timeout 15 seconds
# LLM streaming responses can be slow; 5 minutes is enough for any real API call.
read_timeout 5 minutes
request_timeout 2 minutes

# Hard cap: prevent a runaway process from exhausting Squid's fd budget.
client_ip_max_connections 64

# CONNECT tunnels are not cacheable; keep a small memory cache only.
cache deny all
cache_mem 32 MB

# -------------------------------------
# ACL definitions
# -------------------------------------

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443

acl CONNECT method CONNECT

# External domain whitelist — hostname matched directly, no DNS resolution.
acl allowed_domains dstdomain "/etc/squid/allow-domains.txt"

# Internal IP/CIDR destinations — any port allowed (see rule ordering below).
# Supported formats (one entry per line): IP, CIDR (10.0.0.0/8), IP range.
# For CONNECT to a hostname Squid resolves it to check this ACL (see DNS note).
# For CONNECT to a bare IP no DNS is needed.
acl internal_dsts dst "/etc/squid/allow-internal.txt"

# -------------------------------------
# Access rules — first match wins
# -------------------------------------

# 1. Internal destinations: allow all ports and methods before port checks.
#    This must come before the !Safe_ports and CONNECT !SSL_ports denies.
http_access allow internal_dsts

# 2. External traffic: block non-standard ports and non-HTTPS CONNECT.
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# 3. External: allow only whitelisted domains (ports already filtered above).
http_access allow allowed_domains

# 4. Deny everything else.
http_access deny all

# -------------------------------------
# Protocol coverage
# -------------------------------------
# Squid handles HTTP proxy protocol only (plain HTTP and CONNECT tunnels).
# Protocols not covered here and their status:
#
#   HTTP/2 over TCP, gRPC   → works via CONNECT tunnel (same as HTTPS).
#   HTTP/3 (QUIC/UDP)       → Squid cannot proxy UDP; effectively blocked
#                             because sandbox: internal: true removes the
#                             default route — no UDP path to the internet.
#   Raw TCP (non-HTTP-proxy) → cannot reach internet for the same reason.
#   UDP / ICMP              → no internet route from sandbox.
#   DNS (UDP 53)            → handled by Docker embedded resolver (127.0.0.11);
#                             resolves names for proxy routing but carries no
#                             direct internet route itself.
#
# Summary: the only internet-capable path from the sandbox is this proxy on
# port 3128; non-HTTP protocols are effectively blocked by network isolation.

# -------------------------------------
# Privacy
# -------------------------------------

forwarded_for delete
request_header_access X-Forwarded-For deny all
request_header_access Via deny all

# -------------------------------------
# Logging
# -------------------------------------

access_log daemon:/var/log/squid/access.log squid
