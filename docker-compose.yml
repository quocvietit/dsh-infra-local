services:
  dsh:
    image: ${DSH_IMAGE:-dsh-web:1.0.0}

    build:
      context: .

      dockerfile: Dockerfile

      args:
        DSH_COMMIT_HASH: ${DSH_COMMIT_HASH:-0000000}

    container_name: deepseek-harness

    restart: unless-stopped

    pull_policy: never

    entrypoint:
      - /usr/bin/tini

      - --

      - /bin/sh

      - /usr/local/bin/dsh-entrypoint.sh

    # Compose interpolates `.env` for ${VAR} below. `env_file` also injects
    # those keys into the container. `docker compose restart` does NOT reread
    # `.env` — use `docker compose up -d` (recreate) after edits.
    env_file:
      - path: .env
        required: false

    environment:
      DSH_HOME: /data

      DSH_TELEMETRY_DISABLED: "1"

      DSH_TELEMETRY_MODE: "DISABLED"

      DSH_HOST_OPEN_QUEUE: /data/.host-open-queue

      # Quoted: PATH_MAP contains `:` and `;` which YAML would otherwise split.
      # Host-open: longest prefix wins. Extra binds must be listed here too.
      DSH_HOST_PATH_MAP: "${DSH_HOST_PATH_MAP:-/workspace=${DSH_WORKSPACE_HOST:-${DSH_HOST_ROOT}/workspace};/data=${DSH_HOST_ROOT}/data}"

      # 0 = run baked /opt/dsh from the image (deploy). 1 = overlay host source (dev compose).

      DSH_SOURCE_OVERLAY: "${DSH_SOURCE_OVERLAY:-0}"

      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      http_proxy: http://egress-proxy:3128
      https_proxy: http://egress-proxy:3128

      NO_PROXY: localhost,127.0.0.1,egress-proxy
      no_proxy: localhost,127.0.0.1,egress-proxy

    volumes:
      - ./data:/data
      # Other disk / folder: set DSH_WORKSPACE_HOST in .env (absolute, forward slashes).
      # More folders: docker-compose.override.yml (see docker-compose.override.example.yml).
      - ${DSH_WORKSPACE_HOST:-./workspace}:/workspace
      - ./patch-runtime.mjs:/usr/local/bin/dsh-patch-runtime.mjs:ro
      # - ./entrypoint.sh:/usr/local/bin/dsh-entrypoint.sh:ro
      # Maven: settings on host (mirrors/credentials), repo in a named Linux volume.
      # Named volume avoids WSL2 9P overhead that causes Maven to hang under heavy
      # file I/O on Windows-mounted directories. Delete the volume to clear the cache:
      #   docker volume rm dsh-docker_maven-repository
      - maven-repository:/home/dsh/.m2/repository
      - ./maven/settings.xml:/home/dsh/.m2/settings.xml:ro

    networks:
      - sandbox

    depends_on:
      - egress-proxy

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID

    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2.0"

  web-gateway:
    image: alpine/socat:1.8.1.3

    container_name: dsh-web-gateway

    restart: unless-stopped

    command:
      - "TCP-LISTEN:3080,fork,reuseaddr"
      - "TCP:deepseek-harness:3081"

    ports:
      - "127.0.0.1:3080:3080"

    networks:
      - sandbox
      - frontend

    depends_on:
      - dsh

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.25"

  egress-proxy:
    image: ubuntu/squid:6.6-24.04_edge
    container_name: dsh-egress-proxy

    restart: unless-stopped

    # Docker embedded DNS only (host/company resolvers). IPv6 off avoids 503 hangs.
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"

    volumes:
      - ./proxy/squid.conf:/etc/squid/squid.conf:ro
      - ./proxy/allow-domains.txt:/etc/squid/allow-domains.txt:ro
      - ./proxy/allow-internal.txt:/etc/squid/allow-internal.txt:ro

    networks:
      - sandbox
      - internet

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    cap_add:
      - SETUID
      - SETGID

    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

volumes:
  maven-repository:

networks:

  # DSH chỉ nằm trong network này.
  # internal=true => không có direct Internet.
  sandbox:
    internal: true

  frontend:
    driver: bridge

  # Chỉ Squid được join network có Internet.
  internet:
    driver: bridge