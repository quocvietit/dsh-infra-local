# Profile overlay: deployment knobs only. Runtime lives in the image.
# Later rows with the same `id` replace earlier bundle/preset rows.
# Restart: docker compose restart dsh

# ── LLM / search ────────────────────────────────────────────────────────────
# Hide the shipped DeepSeek Official adapter in Settings → Models.
- id: llm-deepseek
  disabled: true

# Disable DeepSeek web_search. Set disabled: false to turn search back on.
- id: web-search-deepseek
  disabled: true

# Presets still mount tool-web for fetch; search: false keeps web_search off.
- id: tool-web
  config:
    search: false

# Skill badges in chat. disabled: true to hide.
- id: skill-badge
  disabled: false

# Hide Send/Submit feedback: slash /feedback, Like/Dislike, and the dialog.
- id: ui-message-feedback
  disabled: true
- id: command-feedback
  disabled: true
- id: message-feedback
  disabled: true

# ── Workflow (optional) ─────────────────────────────────────────────────────
# Uncomment both rows to turn off workflow on this deployment:
# - id: workflow-ptc
#   disabled: true
# - id: tool-workflow
#   disabled: true

# ── Schedule UI (shipped disabled in web bundle) ────────────────────────────
# - id: ui-schedule
#   disabled: false

# ── Browser Use (Chrome DevTools MCP) ───────────────────────────────────────
# Isolated Chromium per live Session. Do not list mcp__chrome-devtools-mcp__*
# in toolOrder (leave them under <unlisted-tools>).
# Attach mode allows one Session at a time. Avoid performance_* / lighthouse_audit
# (CrUX is disabled in the provider; those tools are still not needed here).
- id: browser-use
  name: '@deepseek-ai/dsh-browser-use'
- id: browser-use-chrome-devtools-mcp
  name: '@deepseek-ai/dsh-experimental-browser-use-chrome-devtools-mcp'
  config:
    mode: launch
    headless: true
    executablePath: /usr/bin/chromium
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      openai:
        apiKeyEnv: OPENAI_API_KEY
      llm-local:
        api: openai-completions
        baseURL: http://localhost:1234/v1
        models:
          - id: text-embedding-nomic-embed-text-v1.5
            name: text-embedding-nomic-embed-text-v1.5
          - id: qwen-qwen2.5-coder-14b-instruct
            name: qwen-qwen2.5-coder-14b-instruct
          - id: qwen2.5-coder-7b-instruct
            name: qwen2.5-coder-7b-instruct
        apiKeyEnv: LLM_LOCAL_API_KEY
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: llm-local
    model: qwen2.5-coder-7b-instruct
- id: locale
  name: "@deepseek-ai/dsh-client-locale"
  config:
    preference: en
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: dark
- id: session-log-deepseek
  name: "@deepseek-ai/dsh-session-log-deepseek"
  config:
    enabled: false
- id: trusted-operations
  name: "./trusted-operations.mjs"
